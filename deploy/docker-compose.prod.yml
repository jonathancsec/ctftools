name: forensic-workbench-prod

# Production stack: Caddy terminates TLS, the web container is not published,
# and a scheduler reaps expired jobs. See README "Deploy on a VPS".
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "180", "app:create_app()"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in deploy/.env}
      DATA_DIR: /data
      QUEUE_MODE: rq
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE: forensics
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-33554432}
      MAX_ARTIFACT_BYTES: ${MAX_ARTIFACT_BYTES:-5242880}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      JOB_STALE_HOURS: ${JOB_STALE_HOURS:-2}
      TOOL_TIMEOUT: ${TOOL_TIMEOUT:-60}
      UPLOAD_LIMIT_PER_HOUR: ${UPLOAD_LIMIT_PER_HOUR:-20}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-25}
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
    volumes:
      - forensics-data:/data
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "forensics"]
    environment:
      DATA_DIR: /data
      QUEUE_MODE: rq
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE: forensics
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-33554432}
      MAX_ARTIFACT_BYTES: ${MAX_ARTIFACT_BYTES:-5242880}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      JOB_STALE_HOURS: ${JOB_STALE_HOURS:-2}
      TOOL_TIMEOUT: ${TOOL_TIMEOUT:-60}
    volumes:
      - forensics-data:/data
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Deletes jobs past RETENTION_HOURS, prunes upload throttles and reaps
    # analyses whose worker disappeared. Runs hourly.
    command: ["sh", "-c", "while true; do flask --app app:create_app cleanup; sleep 3600; done"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in deploy/.env}
      DATA_DIR: /data
      QUEUE_MODE: rq
      REDIS_URL: redis://redis:6379/0
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      JOB_STALE_HOURS: ${JOB_STALE_HOURS:-2}
    volumes:
      - forensics-data:/data
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  forensics-data:
  redis-data:
  caddy-data:
  caddy-config:
